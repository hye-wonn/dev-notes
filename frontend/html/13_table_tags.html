<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표(table) 태그</title>
  </head>
  <body>
    <table>
      <caption>
        성적
      </caption>
      <!-- 표의 제목 -->
      <thead>
        <tr>
          <th>이름</th>
          <th>파이선</th>
          <th>HTML</th>
          <th>JS</th>
        </tr>
      </thead>
      <!-- 컬럼 그룹 -->
      <tbody>
        <tr>
          <!-- 1행 -->
          <th>양예지</th>
          <td>54</td>
          <td>88</td>
          <td>0</td>
        </tr>
        <tr>
          <!-- 2행 -->
          <th>최민주</th>
          <td>30</td>
          <td>85</td>
          <td>0</td>
        </tr>
      </tbody>
      <!-- 본문 (실제 데이터 행들) -->
      <tfoot>
        <tr>
          <th>평균</th>
          <td>50.3점</td>
        </tr>
      </tfoot>
      <!-- 합계, 평균, 총계 같이 표의 요약 및 결론을 담은 행 그룹 -->
    </table>
  </body>
</html>
