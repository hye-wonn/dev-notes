<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
      [전역 속성(Global Attributes)]
      * id: 식별자 (문서 내 유일하게 사용)
      * class: 식별자 (여러 요소에 공통적으로 사용 가능)
      * lang: 언어 선언
      * title: 마우스 호버 시에 툴팁으로 표시되는 내용
      * hidden: 요소를 화면에 숨길 때 사용 (DOM에만 존재)
      * tabindex: 키보드 탭 순서 제어
      * data-*: 개발자가 정의하는 커스텀 데이터 속성
      * style: 인라인 CSS

      [스크린 리더 관련 속성]
      * aria-current: 현재 위치
      * aria-hidden: 스크린 리더에만 숨김
    -->
    <header id="header" class="text" title="hello!">
      <p tabindex="0" style="color: aqua">hi!</p>
      <p id="p" class="text" tabindex="1">header inside</p>
    </header>

    <!-- radio: 단독 선택 -->
    <form action="">
      <fieldset>
        <legend>성별</legend>

        <label> <input type="radio" name="gender" value="male" /> 남성 </label>
        <label>
          <input type="radio" name="gender" value="female" /> 여성
        </label>
        <label> <input type="radio" name="gender" value="other" /> 기타 </label>
      </fieldset>
    </form>

    <!-- checkbox: 복수 선택 -->
    <form action="">
      <fieldset>
        <legend>성별</legend>

        <label for=""> <input type="checkbox" /> 여성 </label>
        <label for=""> <input type="checkbox" /> 남성 </label>
        <label for=""> <input type="checkbox" /> 기타 </label>
      </fieldset>
    </form>

    <!-- 
      [속성]
      * href : 이동할 url, #id, mailto:, tel: 가능해요
      * target : _self (현재 탭, 기본), _blank (새 탭)
      * rel : 링크 관계. noopener noreferrer (새 탭 보안)
      * download : 클릭 시 다운로드
      * hreflang : 링크 대상 문서의 언어
    -->
    <a
      href="https://ko.dict.naver.com/"
      target="_blank"
      rel="noopener noreferrer"
      >NAVER</a
    >
    <a href="assets/fox.jpg" download="image.jpg">다운로드</a>

    <!-- 이미지 -->
    <!--
      [속성]
      * src: 이미지 파일 경로 또는 URL
      * alt: 이미지의 구체적인 설명
      * width/height: 이미지 크기 조절 (사용 X)
      * loading: lazy (지연, 사용자가 화면을 봤을 때 이미지 로드), eager (즉시 로드, 기본)
    -->
    <img src="assets/fox.jpg" alt="여우 - 위키백과, 우리 모두의 백과사전" />
  </body>
</html>
