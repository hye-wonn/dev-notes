<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>강조 및 의미부여 태그 사용</title>
  </head>
  <body>
    <p><strong>주의:</strong> 프로젝트 마감 기한을 반드시 엄수하세요.</p>
    <!-- strong 태그는 문장 내에서 중요한 부분을 나타낼 때 사용 (가장 강한 강조, 언제든 사용 가능, 예: 경고메시지, 주의사항 등) -->

    <p>이 서비스는 <em>반응형 웹</em> 기술을 사용하여 제작되었습니다.</p>
    <!-- em 태그는 특정 단어를 강조할 때 사용 (약한 강조, 예: 기술 용어나 외국어 등) -->

    <p>찾으시는 검색어 <mark>HTML</mark> 관련 게시글입니다.</p>
    <!-- 사용자의 검색어와 일치하는 부분을 보여주거나, 주의를 환기해야 하는 특정 단어에 사용 -->

    <p><small>본 게시물의 저작권은 저에게 있습니다.</small></p>
    <!-- 저작권 표기, 주석, 법적 고지사항 등 본문 내용에서 약간 벗어난 부가 정보를 표현할 때 사용 -->

    <p>오늘의 할인 가격: <del>50,000원</del> <ins>35,000원</ins></p>
    <!-- del: 수정 전에 내용이라 삭제하였으나, 명시하고 싶을 때 사용 -->
    <!-- ins: 삭제된 텍스트 대신 새로 추가된 내용임을 나타내고 싶을 때 사용 -->
  </body>
</html>
