<!-- HTML: 계층 구조를 가진 문서 -->
<!doctype html>
<!--
  HTML 태그가 아니고,   문서 형식 선언
  규칙1: HTML 문서의 최상단에 위치

  해당 내용의 의미:
  HTML 파서에게 "이 문서는 최신 HTML 표준 스펙을 따르고 있으니, 그에 맞추어 올바르게 파싱(해석)해라" 하고 명령하는 것과 똑같음

  XHTML
  <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">

  HTML5
  <!doctype html>
-->
<html lang="en">
  <!-- DOM트리에서 루트 노드 -->
  <!-- 문서의 주 사용 언어를 명시 -->
  <head>
    <!-- 검색 엔진 로봇에게 필요한 메타데이터를 전달 -->
    <!-- SEO에 좋음 -->
    <meta charset="UTF-8" />
    <!-- 문자 인코딩 방식 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 화면 비율 -->
    <title>Document</title>
    <!-- 사이트의 이름 -->
  </head>
  <body>
    <!-- 웹 브라우저 화면에 실제로 표시될 본문 내용 -->
    <p>Hello, World!</p>
    <p><strong>안녕하세요, 세상!</strong></p>
  </body>
</html>
