<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문단, 줄바꿈, 구분선 태그 연습</title>
  </head>
  <body>
    <p>문단입니다.</p>
    <!-- 문단을 정의할 때 사용 -->

    <p>
      주소는 제주시고, <br />
      해당 주소는 제가 사는 곳의 위치입니다.
    </p>
    <!-- 블록(Block) 요소: 항상 가로 전체 영역을 차지 -->
    <!-- br 태그는 줄바꿈 할 때 사용. 여러 번(디자인 용도) 사용 X -->

    <p>내용 1</p>
    <hr />
    <!-- hr 태그는 주제가 전환될 때 사용 -->
    <p>내용 2</p>
  </body>
</html>
