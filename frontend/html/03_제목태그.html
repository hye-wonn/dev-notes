<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제목 태그 연습</title>
  </head>
  <body>
    <h1>제목 1</h1>
    <!-- 페이지 전체의 주제, 한 번만 사용 -->
    <h2>제목 2</h2>
    <h3>제목 3</h3>
    <h4>제목 4</h4>
    <h5>제목 5</h5>
    <h6>제목 6</h6>
    <!-- 디자인 용도 X -->

    <!-- 예시 -->
    <h1>대주제</h1>
    <h2>소주제1</h2>
    <h3>섹션1</h3>
    <h3>섹션2</h3>
    <h2>소주제2</h2>
    <h3>섹션</h3>

    <!-- 잘못된 예시 1 -->
    <h1>제목 1</h1>
    <h1>제목 2</h1>

    <!-- 잘못된 예시 2 -->
    <h1>제목 1</h1>
    <h4>제목 4</h4>
  </body>
</html>
