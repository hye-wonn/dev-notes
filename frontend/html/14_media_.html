<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>audio, video, iframe tag</title>
  </head>
  <body>
    <!-- figure -->
    <!-- figure는 이미지 + 설명할 때 사용 -->
    <figure>
      <img
        src="assets\fox.jpg"
        alt="여우 - 위키백과, 우리 모두의 백과사전"
        style="width: 100px"
      />
      <figcaption>귀여운 여우: 날 보고도 그냥 가겠다고?</figcaption>
    </figure>

    <!-- 이미지 말고 다른 콘텐츠도 가능 -->
    <!-- 예시 1. 코드 블록 -->
    <figure>
      <pre><code>greeting = "hello, world!"</code></pre>
      <figcaption>python string 변수 선언 예시</figcaption>
    </figure>

    <!-- 예시 2. 인용문 -->
    <figure>
      <!-- blockquote 태그는 텍스트가 긴 인용문임을 나타낼 때 사용 -->
      <blockquote>
        <p>성악설: 인간은 태어날 때부터 악하다.</p>
      </blockquote>
      <figcaption>- 순자</figcaption>
    </figure>

    <!-- 예시 3. 여러 이미지 사용 -->
    <figure>
      <img src="#" alt="개선 전 코드" />
      <img src="#" alt="개선 후 코드" />
      <figcaption>코드 개선 전(좌)과 후(우) 비교</figcaption>
    </figure>

    <!--
      figure와 img는 각각 언제 사용하나요?
      figure는 화면이든 스크린리더든 이 이미지에 대해서 엄청 자세하게 정리해보고 싶을 때 사용
      img는 이미지를 보여주고 싶고, 설명은 안하고 싶을 때 사용
    -->

    <!-- audio tag -->
    <!-- 
      [속성 정리]
      controls: 브라우저에 기본 컨트롤바 렌더링
      autoplay: 페이지 로드 시에 자동 재생
      loop: 오디오 반복 재생
      muted: 음소거 상태로 시작
    -->
    <!--
      [오디오 포맷]
      * mp3
      * ogg, wav, aac, webm
    -->
    <audio src="assets\audio.mp3" controls autoplay loop muted></audio>

    <!-- video tag -->
    <!-- 
      [속성 정리]
      controls: 브라우저에 기본 컨트롤바 렌더링
      autoplay: 페이지 로드 시에 자동 재생
      loop: 오디오 반복 재생
      muted: 음소거 상태로 시작
      poster: 썸네일 이미지 설정
    -->
    <!--
      [비디오 포맷]
      * mp4
      * ogg, webm
    -->
    <video
      src="assets/video.mp4"
      style="width: 500px"
      controls
      poster="assets/fox.jpg"
    ></video>

    <!-- iframe tag -->
    <!-- 외부 페이지에 있는 것을 가지고 오는 태그 -->
    <!-- title은 img 태그의 alt 속성같은 것으로 필수 요소 -->
    <!-- 
      allow 값
      autoplay: 자동 재생
      fullscreen: 전체화면
      camera: 카메라 접근
      microphone: 마이크 접근
      geolocation: 위치 정보 접근
      payment: 결제 API
    -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/gU55alEdxaw?si=LZI2uj7UA1V13pkC"
      title="YouTube video player"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
    ></iframe>
  </body>
</html>
