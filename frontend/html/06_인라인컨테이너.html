<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인라인 컨테이너 태그 span</title>
  </head>
  <body>
    <span>내용</span>
    <!-- 인라인 요소이고, 의미와 역할이 없음. 특정 문장에 디자인을 주고 싶을 때 사용 -->
    <!-- 태그 내에서 사용 (주로 p 태그에서 사용) -->

    <p>안녕하세요. 저는 <span style="color: blue">유혜원</span> 입니다.</p>
  </body>
</html>
