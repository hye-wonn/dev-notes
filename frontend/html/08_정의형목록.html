<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정의형 목록 태그 사용</title>
  </head>
  <body>
    <!-- 정의형 목록 전체를 감싸는 부모 태그 -->
    <!-- dl은 dt와 dd를 자식으로 사용. dt와 dd만 따로 사용 X -->
    <dl>
      <!-- 우리가 정의할 용어 이름 -->
      <dt>사과하다.</dt>
      <!-- 해당 용어에 대한 상세 설명 -->
      <dd>자기의 잘못을 인정하고 용서를 비는 것이다.</dd>

      <!-- 우리가 정의할 용어 이름 -->
      <dt>사과하다.</dt>
      <!-- 해당 용어에 대한 상세 설명 -->
      <dd>자기의 잘못을 인정하고 용서를 비는 것이다.</dd>

      <!-- 우리가 정의할 용어 이름 -->
      <dt>사과하다.</dt>
      <!-- 해당 용어에 대한 상세 설명 -->
      <dd>자기의 잘못을 인정하고 용서를 비는 것이다.</dd>
    </dl>
  </body>
</html>
