<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시맨틱(sementic) 태그</title>
  </head>
  <body>
    <!-- 
      시맨틱(semantic) 웹이란?
      시맨틱이란 해당 태그가 어떤 의미를 담고 있는가 이다.
      시맨틱 웹은 태그가 의미가 있는 애들로 구조가 짜인 것들

      시맨틱 웹이 필요한 이유
      컴퓨터가 이해하기 쉬움 == 검색 엔진 중요도를 파악하기 위함 (검색 엔진 최적화)
      개발자들끼리 이해하기 쉬움 == 태그의 의미를 보고 바로 이해 가능 (유지 보수성)
      스크린 리더 사용자가 탐색하기 쉬움 == 시각장애인이 이미지를 볼 수 없을 때, alt 텍스트를 듣고 이해 가능 (접근성)
    -->

    <header>
      <!-- header 태그는 컨테이너로 문자를 적지 않음 -->
      <!-- 로고, 사이트명, 검색창, 웹 이동 링크들... -->
      <h1>사이트 이름</h1>
      <nav>
        <!-- nav 태그는 컨테이너로 주요 탐색(만들어놓은 탭들) 링크의 묶음 -->
        <!-- 한 페이지에 여러 번 사용 가능 -->
        <ul>
          <li><a href="/">HOME</a></li>
          <li>Projects</li>
          <li>Blogs</li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- main 태그는 해당 페이지의 핵심 콘텐츠 영역 -->
      <!-- 한 문서에 하나만 존재 -->
      <!-- body 태그의 직계 자식 -->
    </main>
    <article>
      <!-- 다른 페이지나 플랫폼에 그대로 배포하거나 공유해도 의미가 충분히 전달되는 독립적인 콘텐츠 영역 -->
      <!-- 블로그, 댓글 -->
    </article>
    <div>
      <!-- 디자인 용도 -->
      <p>hello?</p>
    </div>
    <section>
      <!-- 주제별로 묶이는 구역 -->
      <!-- heading tag(h1~h6) -->
      <!-- 댓글들의 묶음, 블로그들의 묶음 -->
    </section>
    <aside>
      <!-- 사이드바, 참고 정보 (예: Notion 오른쪽에 뜨는 목차) -->
      <!-- 주요 컨텐츠와 연관이 있으며 간접적으로 부가 정보를 알려주는 데이터들을 묶음 -->
    </aside>
    <footer>
      <!-- 페이지 하단에 있는 정보들 -->
      <!-- 이 페이지를 누가 만들었는지, 관련 링크들, 이메일, 연락처, 작성자 정보 -->
    </footer>
  </body>
</html>
